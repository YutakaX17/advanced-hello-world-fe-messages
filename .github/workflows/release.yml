name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: advanced-hello-world-fe-messages
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: advanced-hello-world-fe-messages
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: YutakaX17/advanced-hello-world-fe-core
          ref: 7ae9d2d505d4403258bf4a10fc545e49b174bc01
          path: advanced-hello-world-fe-core
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          registry-url: https://npm.pkg.github.com
      - run: npm ci
        working-directory: advanced-hello-world-fe-core
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm pack
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: advanced-hello-world-fe-messages
          format: spdx-json
          output-file: advanced-hello-world-fe-messages/sbom.spdx.json
      - run: sha256sum *.tgz sbom.spdx.json > SHA256SUMS
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          files: |
            advanced-hello-world-fe-messages/*.tgz
            advanced-hello-world-fe-messages/sbom.spdx.json
            advanced-hello-world-fe-messages/SHA256SUMS
